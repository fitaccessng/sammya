{% extends "base.html" %}

{% block title %}Login - Sammya ERP{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-screen bg-slate-50">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-lg shadow-lg p-8">
           <img src="{{ url_for('static', filename='images/sammya_logo.jpeg') }}" alt="Sammya Logo">
            
           <br><h2 class="text-2xl font-bold text-slate-900 text-center mb-6">Login</h2>
            
            <form method="POST" class="space-y-4">
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required 
                        class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:ring-blue-500"
                        placeholder="your@email.com">
                </div>
                
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
                    <!-- Relative container to position the toggle icon -->
                    <div class="relative mt-1">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            required 
                            class="block w-full rounded-md border border-slate-300 pl-3 pr-10 py-2 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:ring-blue-500"
                            placeholder="••••••••">
                        
                        <!-- Show / Hide Password Button -->
                        <button 
                            type="button" 
                            id="togglePassword" 
                            class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600 focus:outline-none">
                            <!-- Eye Icon (Show) -->
                            <svg id="eyeIcon" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            <!-- Eye Off Icon (Hide) -->
                            <svg id="eyeOffIcon" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.016 10.016 0 013.682-.863c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m-2.5 2.5a3 3 0 01-4.243-4.243" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18" />
                            </svg>
                        </button>
                    </div>
                </div>
                
                <div class="flex items-center justify-between">
                    <a href="{{ url_for('main.forgot_password') }}" class="text-sm text-blue-600 hover:text-blue-800">Forgot Password?</a>
                </div>
                
                <button 
                    type="submit" 
                    class="w-full px-4 py-2 bg-blue-600 text-white font-medium rounded-md hover:bg-blue-700 transition">
                    Sign In
                </button>
            </form>
            
            <div class="mt-6 border-t border-slate-200 pt-4 text-center">
                <p class="text-sm text-slate-600">
                    Don't have an account? 
                    <a href="{{ url_for('main.signup') }}" class="text-blue-600 hover:text-blue-800 font-semibold">Sign Up</a>
                </p>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript to toggle visibility -->
<script>
    const togglePassword = document.querySelector('#togglePassword');
    const password = document.querySelector('#password');
    const eyeIcon = document.querySelector('#eyeIcon');
    const eyeOffIcon = document.querySelector('#eyeOffIcon');

    togglePassword.addEventListener('click', function () {
        // Toggle input type
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);
        
        // Toggle SVG icons
        eyeIcon.classList.toggle('hidden');
        eyeOffIcon.classList.toggle('hidden');
    });
</script>
{% endblock %}
